<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <title>My trips · TripSplit</title>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="trips.html">
            <span class="brand-mark">T</span>TripSplit
        </a>
        <nav class="nav" aria-label="Main">
            <a class="active" href="trips.html">Trips</a>
            <a href="#" aria-disabled="true">Activity</a>
            <a href="#" aria-disabled="true">Balances</a>
        </nav>
        <div class="user">
            <span id="user-name"></span>
            <button id="btn-logout" class="btn-ghost" type="button">Log out</button>
        </div>
    </header>

    <main class="container">
        <section class="card hero-card row">
            <div>
                <span class="badge">Trips dashboard</span>
                <h1 id="greeting" style="margin-top:.5rem"></h1>
                <p class="muted">Manage shared itineraries and travel with financial peace of mind.</p>
            </div>
            <div class="stats">
                <div class="stat">
                    <small>Active trips</small>
                    <strong id="stat-active">0</strong>
                </div>
                <div class="stat">
                    <small>Total trips</small>
                    <strong id="stat-total">0</strong>
                </div>
                <div class="stat">
                    <small>Total budget</small>
                    <strong id="stat-budget" style="font-size:1.1rem">$0.00</strong>
                </div>
            </div>
        </section>

        <div class="row">
            <div class="chips" role="group" aria-label="Filter trips">
                <button class="chip active" data-filter="all" type="button">All</button>
                <button class="chip" data-filter="ongoing" type="button">Ongoing</button>
                <button class="chip" data-filter="upcoming" type="button">Upcoming</button>
                <button class="chip" data-filter="past" type="button">Past</button>
            </div>
            <button id="btn-new" class="btn" type="button">+ Create new trip</button>
        </div>

        <p id="trips-msg" class="alert" role="alert"></p>

        <section id="new-trip" class="card" hidden>
            <h2>New trip</h2>
            <form id="trip-form" novalidate>
                <div class="field-grid">
                    <label class="field">
                        Trip name
                        <input name="nombre" maxlength="120" required>
                    </label>
                    <label class="field">
                        Destination
                        <input name="destino" maxlength="120" required>
                    </label>
                    <label class="field">
                        Start date
                        <input name="fecha_inicio" type="date" required>
                    </label>
                    <label class="field">
                        End date
                        <input name="fecha_fin" type="date" required>
                    </label>
                    <label class="field">
                        Total budget (USD)
                        <input name="presupuesto_total" type="number" min="0" step="0.01" required>
                    </label>
                </div>

                <p id="form-msg" class="alert" role="alert"></p>

                <div class="row" style="justify-content:flex-start">
                    <button class="btn" type="submit">Save trip</button>
                    <button id="btn-cancel" class="btn-ghost" type="button">Cancel</button>
                </div>
            </form>
        </section>

        <section id="trip-list" class="grid-cards" aria-live="polite"></section>
        <p id="empty" class="empty" hidden>No trips here yet. Create your first trip to get started.</p>
    </main>

    <footer class="footer">TripSplit · Shared trip finances in harmony</footer>

    <script type="module" src="js/trips-page.js"></script>
</body>
</html>
